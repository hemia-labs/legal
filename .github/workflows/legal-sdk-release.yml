name: Legal SDK release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-sdk-release-main
  cancel-in-progress: false
  queue: max

jobs:
  classify:
    if: github.repository == 'hemia-labs/legal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.batch.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify the SDK version merge
        id: batch
        env:
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BASE_SHA="$(git rev-parse HEAD^1)"
          fi
          node scripts/legal-sdk-release.mjs classify "$BASE_SHA"

  validate:
    needs: classify
    uses: ./.github/workflows/legal-sdk-ci.yml
    with:
      preserve-release-artifact: ${{ needs.classify.outputs.release == 'true' }}

  version-pr:
    needs: [classify, validate]
    if: needs.classify.outputs.release != 'true' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Find pending SDK changesets
        id: changesets
        run: |
          bun run changeset status --output "$RUNNER_TEMP/changeset-status.json"
          node -e "const s=require(process.env.RUNNER_TEMP+'/changeset-status.json'); require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'pending='+(s.releases.some(r=>r.name==='@hemia/legal'))+'\n')"
      - name: Apply SDK changesets
        if: steps.changesets.outputs.pending == 'true'
        run: |
          bun run version:legal-sdk
          node scripts/legal-sdk-release.mjs notes > "$RUNNER_TEMP/legal-sdk-notes.md"
      - name: Confirm this is still the current main commit
        id: current
        if: steps.changesets.outputs.pending == 'true'
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then echo "current=true" >> "$GITHUB_OUTPUT"; fi
      - name: Create a GitHub App token when configured
        id: app-token
        if: steps.current.outputs.current == 'true' && vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: legal
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update the SDK version PR
        id: version-update
        if: steps.current.outputs.current == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          base: main
          branch: changeset-release/legal-sdk
          title: 'chore(legal-sdk): release package version'
          commit-message: 'chore(legal-sdk): release package version'
          body-path: ${{ runner.temp }}/legal-sdk-notes.md
          add-paths: |
            packages/sdk/package.json
            packages/sdk/CHANGELOG.md
            bun.lock
            .changeset/*.md
      - name: Validate the bot-created version PR
        if: steps.app-token.outputs.token == '' && (steps.version-update.outputs.pull-request-operation == 'created' || steps.version-update.outputs.pull-request-operation == 'updated')
        run: gh workflow run legal-sdk-ci.yml --ref changeset-release/legal-sdk

  publish:
    needs: [classify, validate]
    if: needs.classify.outputs.release == 'true' && vars.ENABLE_LEGAL_SDK_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: legal-sdk-release
          path: ${{ runner.temp }}/legal-sdk-release
      - name: Publish the verified SDK and create its tag and release
        env:
          ENABLE_LEGAL_SDK_PUBLISH: ${{ vars.ENABLE_LEGAL_SDK_PUBLISH }}
          LEGAL_SDK_BOOTSTRAP_TOKEN: ${{ secrets.LEGAL_SDK_BOOTSTRAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/legal-sdk-release.mjs publish "$RUNNER_TEMP/legal-sdk-release"

name: hemia-legal

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: hemia-legal-api:${LEGAL_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
      args:
        LEGAL_REVISION: ${LEGAL_REVISION:-local}
    restart: unless-stopped
    init: true
    env_file:
      - path: ${LEGAL_ENV_FILE:-./apps/api/.env.production}
        format: raw
    environment:
      NODE_ENV: production
      PORT: "3017"
      EVENT_LOG_FILE: /tmp/legal-events.jsonl
      NODE_OPTIONS: --max-old-space-size=256
    extra_hosts:
      - host.docker.internal:host-gateway
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3017/health/ready', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

  web:
    image: hemia-legal-web:${LEGAL_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        LEGAL_REVISION: ${LEGAL_REVISION:-local}
    restart: unless-stopped
    environment:
      LEGAL_API_URL: http://api:3017
      SSO_COOKIE_NAME: ${LEGAL_COOKIE_NAME:-legal_session}
      NODE_OPTIONS: --max-old-space-size=256
    ports:
      - "${LEGAL_BIND_ADDRESS:-127.0.0.1}:${LEGAL_HTTP_PORT:-8082}:3000"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /app/apps/web/.next/cache:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
